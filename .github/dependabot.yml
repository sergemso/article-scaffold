version: 2
updates:
  # GitHub Actions updates
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
    commit-message:
      prefix: "ci(deps): "
    labels:
      - "dependencies"
      - "github-actions"
    open-pull-requests-limit: 10

  # Python/pip updates
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
    commit-message:
      prefix: "ci(deps): "
    labels:
      - "dependencies"
      - "python"
    open-pull-requests-limit: 10

  # Docker updates (for pandoc image)
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
    commit-message:
      prefix: "ci(deps): "
    labels:
      - "dependencies"
      - "docker"
    open-pull-requests-limit: 5