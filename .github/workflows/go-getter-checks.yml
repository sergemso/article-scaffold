# Generated by go-getter apply; do not edit. Tier-3 guardrail checks (decision 0009) and CI-placed verification checks (decision 0071).
name: go-getter checks

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: "go-getter-checks-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  go-getter-checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: sh .go-getter/bin/go-getter check --stage ci

  verify-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python -m pip install build && python -m build

  verify-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sh .github/scripts/install-tex.sh && make setup test
