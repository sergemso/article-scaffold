# Smoke test: a default Cookiecutter render. The plan/state harness this once
# also validated is archived (docs/plans/archive/t-queue/).
name: Plan CI

"on":
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: plan-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render-smoke:
    name: Default render
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.10"

      - name: Install Cookiecutter
        run: |
          python3 -m pip install --disable-pip-version-check \
            cookiecutter jinja2-time pyyaml

      - name: Render with the default context
        run: |
          cookiecutter --no-input . --output-dir /tmp/render
          test -f /tmp/render/articles.subject_slug/paper/article.tex
          test -f /tmp/render/articles.subject_slug/metadata.yaml
          python3 - <<'PY'
          import pathlib
          import yaml

          root = pathlib.Path("/tmp/render/articles.subject_slug")
          meta = yaml.safe_load((root / "metadata.yaml").read_text())
          assert isinstance(meta, dict), meta
          assert meta.get("title"), meta
          print("render smoke OK:", meta["title"])
          PY
