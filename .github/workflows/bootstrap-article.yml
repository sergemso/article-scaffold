# Bootstrap a new article repository from this cookiecutter template.
#
# Triggered manually (workflow_dispatch) with the same parameters as
# `cookiecutter` would prompt for. Renders the template into a temp dir,
# commits the rendered tree, creates a new GitHub repository under the
# specified owner, and pushes the initial commit.
#
# ─────────────────────────────────────────────────────────────
# PREREQUISITE — the scaffold GitHub App
# ─────────────────────────────────────────────────────────────
# The workflow has no personal access token. It mints GitHub App installation
# tokens with .github/actions/app-token from the secret `APP_PRIVATE_KEY` and the
# variables `APP_ID` and `APP_OWNERS` (the owners it may act for). `owner` must be
# one of them, and the App must be installed on it with all repositories. Set it
# up with docs/skills/setting-up-the-article-github-app.md. Decision 0062.
#
# Two tokens are used: one for the owner without a repository scope
# (Administration write) to create the repo, and one narrowed to the new repo
# (Contents and Workflows write) to push the tree.

name: Bootstrap new article repo

"on":
  workflow_dispatch:
    inputs:
      topic:
        description: "Topic slug — becomes the suffix of the new repo name (articles.<topic>)"
        required: true
        default: "subject_slug"
      title:
        description: "Manuscript title (full)"
        required: true
        default: "Untitled Manuscript"
      subtitle:
        description: "Optional subtitle (leave empty for none)"
        required: false
        default: ""
      manuscript_type:
        description: "Manuscript type label (shown in README)"
        required: false
        default: "Perspective / Review Essay"
      author_name:
        description: "Author full name"
        required: false
        default: "Your Name"
      author_orcid:
        description: "Optional ORCID (no URL prefix, e.g. 0000-0000-0000-0000)"
        required: false
        default: ""
      author_affiliation:
        description: "Author affiliation"
        required: false
        default: "Independent Researcher"
      version:
        description: "Semver version (e.g. 1.0.0)"
        required: false
        default: "1.0.0"
      version_label:
        description: "Human-readable version label (e.g. v1 preprint)"
        required: false
        default: "v1 preprint"
      license:
        description: "SPDX license identifier (CC-BY-4.0 or MIT)"
        required: false
        default: "CC-BY-4.0"
      target_deposit:
        description: "Target deposit venue (Zenodo, OSF, etc.)"
        required: false
        default: "Zenodo"
      doi:
        description: "DOI (leave empty pre-deposit; fill after deposit)"
        required: false
        default: ""
      keywords:
        description: "Comma-separated keywords"
        required: false
        default: "research, methodology"
      abstract:
        description: "Manuscript abstract (long form). Will be inserted into 00_abstract.tex and README."
        required: false
        default: "Replace this placeholder with the manuscript abstract. State the question, the contribution, the evidence base, and the limitations. The abstract is the first thing a reader sees and the only thing many readers will read, so it should be a self-contained summary of the argument, not a teaser for it."
      repo_visibility:
        description: "New repo visibility"
        type: choice
        options:
          - public
          - private
        default: private
      create_companion:
        description: "Also create the public companion repo (release snapshots for Zenodo) "
        type: boolean
        default: true
      owner:
        description: "Owner (org) of the new repo; must be listed in the APP_OWNERS variable"
        required: false
        default: "strebulaev-articles"
      skip_pre_push_hook:
        description: "Skip the pre-push validate hook for the initial bootstrap push (recommended: false, so the workflow fails loudly if the template is broken)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: bootstrap-article-${{ github.ref }}-${{ inputs.topic }}
  cancel-in-progress: false   # never cancel a repo creation mid-flight

jobs:
  bootstrap:
    name: Scaffold and push new article repo
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      repo_full: ${{ steps.create.outputs.repo_full }}

    steps:
      - name: Checkout article-scaffold
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Validate inputs
        id: validate
        env:
          TOPIC: ${{ inputs.topic }}
          VERSION: ${{ inputs.version }}
          LICENSE: ${{ inputs.license }}
          REPO_VISIBILITY: ${{ inputs.repo_visibility }}
          OWNER: ${{ inputs.owner }}
        run: |
          set -euo pipefail

          if ! [[ "$TOPIC" =~ ^[a-z0-9][a-z0-9_-]*$ ]]; then
            echo "::error::topic must be a lowercase slug (letters, digits, _ or -)."
            exit 1
          fi

          REPO_NAME="articles.${TOPIC}"
          if ! [[ "$REPO_NAME" =~ ^articles\.[a-z0-9][a-z0-9_-]*$ ]]; then
            echo "::error::repo_name must match articles.<topic> with a lowercase slug."
            exit 1
          fi

          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::version must be semver, for example 1.0.0 or 1.0.0-rc.1."
            exit 1
          fi

          case "$LICENSE" in
            CC-BY-4.0|MIT) ;;
            *)
              echo "::error::license must be CC-BY-4.0 or MIT."
              exit 1
              ;;
          esac

          case "$REPO_VISIBILITY" in
            public|private) ;;
            *)
              echo "::error::repo_visibility must be public or private."
              exit 1
              ;;
          esac

          if ! [[ "$OWNER" =~ ^[A-Za-z0-9]([A-Za-z0-9-]{0,38})$ ]]; then
            echo "::error::owner is not a valid GitHub user or organization name."
            exit 1
          fi

          echo "repo_name=$REPO_NAME" >> "$GITHUB_OUTPUT"
          echo "owner=$OWNER" >> "$GITHUB_OUTPUT"

      - name: Install cookiecutter + deps
        run: pip install "cookiecutter==2.7.1" jinja2-time pyyaml

      - name: Render template via cookiecutter
        id: cookiecutter
        env:
          TOPIC: ${{ inputs.topic }}
          TITLE: ${{ inputs.title }}
          SUBTITLE: ${{ inputs.subtitle }}
          MANUSCRIPT_TYPE: ${{ inputs.manuscript_type }}
          AUTHOR_NAME: ${{ inputs.author_name }}
          AUTHOR_ORCID: ${{ inputs.author_orcid }}
          AUTHOR_AFFILIATION: ${{ inputs.author_affiliation }}
          VERSION: ${{ inputs.version }}
          VERSION_LABEL: ${{ inputs.version_label }}
          LICENSE: ${{ inputs.license }}
          TARGET_DEPOSIT: ${{ inputs.target_deposit }}
          DOI: ${{ inputs.doi }}
          KEYWORDS: ${{ inputs.keywords }}
          ABSTRACT: ${{ inputs.abstract }}
          OWNER: ${{ steps.validate.outputs.owner }}
          REPO_NAME: ${{ steps.validate.outputs.repo_name }}
        run: |
          set -euo pipefail
          OUTPUT_DIR="$(mktemp -d)"
          # `--no-input` so cookiecutter does not prompt; all values come
          # from the workflow inputs (passed as positional key=value pairs).
          # The `date` input is computed at render time so the user does
          # not need to think about it.
          cookiecutter --no-input --output-dir "$OUTPUT_DIR" . \
            topic="$TOPIC" \
            title="$TITLE" \
            subtitle="$SUBTITLE" \
            manuscript_type="$MANUSCRIPT_TYPE" \
            author_name="$AUTHOR_NAME" \
            author_orcid="$AUTHOR_ORCID" \
            author_affiliation="$AUTHOR_AFFILIATION" \
            version="$VERSION" \
            version_label="$VERSION_LABEL" \
            date="$(date -u +%Y-%m-%d)" \
            license="$LICENSE" \
            target_deposit="$TARGET_DEPOSIT" \
            doi="$DOI" \
            keywords="$KEYWORDS" \
            github_user="$OWNER" \
            abstract="$ABSTRACT"

          PROJECT_DIR="$OUTPUT_DIR/$REPO_NAME"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "repo_name=$REPO_NAME" >> "$GITHUB_OUTPUT"
          echo "Rendered to: $PROJECT_DIR"
          echo "---"
          find "$PROJECT_DIR" -type f | sort

      - name: Verify rendered repo validates
        env:
          PROJECT_DIR: ${{ steps.cookiecutter.outputs.project_dir }}
        run: |
          cd "$PROJECT_DIR"
          make validate

      - name: Configure git identity
        env:
          ACTOR: ${{ github.actor }}
        run: |
          git config --global user.name "$ACTOR"
          git config --global user.email "${ACTOR}@users.noreply.github.com"

      - name: Stage initial commit
        env:
          PROJECT_DIR: ${{ steps.cookiecutter.outputs.project_dir }}
        run: |
          cd "$PROJECT_DIR"
          # cookiecutter's post_gen_project.py hook already initialized git
          # on `master`, made scripts executable, and installed the pre-push
          # hook through scripts/githooks (core.hooksPath).
          git add .
          git commit -m "initial scaffold (from article-scaffold workflow)"

      - name: Mint token to create the repo
        id: admin_token
        uses: ./.github/actions/app-token
        with:
          app-id: ${{ vars.APP_ID }}
          allowed-owners: ${{ vars.APP_OWNERS }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ steps.validate.outputs.owner }}
          permission-administration: write

      - name: Create the GitHub repo
        id: repo
        env:
          GH_TOKEN: ${{ steps.admin_token.outputs.token }}
          OWNER: ${{ steps.validate.outputs.owner }}
          REPO_NAME: ${{ steps.validate.outputs.repo_name }}
          REPO_VISIBILITY: ${{ inputs.repo_visibility }}
        run: |
          set -euo pipefail
          set +x   # the token lives in the environment; never trace it
          REPO_FULL="${OWNER}/${REPO_NAME}"

          # An org-wide token can create public repos, so visibility is always
          # passed explicitly (fact 0005).
          case "$REPO_VISIBILITY" in
            public) PRIVATE=false ;;
            private) PRIVATE=true ;;
            *)
              echo "::error::repo_visibility must be public or private."
              exit 1
              ;;
          esac

          # Refuse to overwrite an existing repository. This makes a rerun
          # fail clearly instead of creating a duplicate or pushing into an
          # unrelated repository.
          if gh repo view "$REPO_FULL" >/dev/null 2>&1; then
            echo "::error::Repository $REPO_FULL already exists; refusing to overwrite."
            exit 1
          fi

          gh api "orgs/${OWNER}/repos" \
            -f name="$REPO_NAME" \
            -F private="$PRIVATE" \
            -f description="Article manuscript repository scaffolded from article-scaffold." \
            >/dev/null

          gh api -X PUT "repos/${REPO_FULL}/topics" \
            -f "names[]=article" -f "names[]=manuscript" \
            -f "names[]=latex" -f "names[]=research" >/dev/null || true

      - name: Mint token to push the new repo
        id: push_token
        uses: ./.github/actions/app-token
        with:
          app-id: ${{ vars.APP_ID }}
          allowed-owners: ${{ vars.APP_OWNERS }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ steps.validate.outputs.owner }}
          repositories: ${{ steps.validate.outputs.repo_name }}
          permission-contents: write
          permission-workflows: write

      - name: Push the initial commit
        id: create
        env:
          GH_TOKEN: ${{ steps.push_token.outputs.token }}
          PROJECT_DIR: ${{ steps.cookiecutter.outputs.project_dir }}
          OWNER: ${{ steps.validate.outputs.owner }}
          REPO_NAME: ${{ steps.validate.outputs.repo_name }}
          REPO_VISIBILITY: ${{ inputs.repo_visibility }}
          SKIP_PRE_PUSH: ${{ inputs.skip_pre_push_hook }}
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          set +x   # never print the token-bearing remote URL to logs
          REPO_FULL="${OWNER}/${REPO_NAME}"

          # Add `origin` with the token embedded in the URL so raw `git push`
          # authenticates non-interactively. We do not echo the URL.
          git remote remove origin 2>/dev/null || true
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${REPO_FULL}.git"

          # By default the pre-push hook runs `make validate` again; the
          # user can opt out via skip_pre_push_hook. The default branch is
          # whatever cookiecutter's post-gen hook initialised.
          DEFAULT_BRANCH="$(git rev-parse --abbrev-ref HEAD)"
          if [ "$SKIP_PRE_PUSH" = "true" ]; then
            git push --no-verify -u origin "$DEFAULT_BRANCH"
          else
            git push -u origin "$DEFAULT_BRANCH"
          fi

          # Scrub the token from the remote URL so it does not stay in .git/config.
          git remote set-url origin "https://github.com/${REPO_FULL}.git"

          echo "repo_url=https://github.com/$REPO_FULL" >> "$GITHUB_OUTPUT"
          echo "repo_full=$REPO_FULL" >> "$GITHUB_OUTPUT"
          echo "::notice::Created ${REPO_VISIBILITY} repo at https://github.com/$REPO_FULL"

      - name: Write job summary
        if: always()
        env:
          REPO_URL: ${{ steps.create.outputs.repo_url }}
          OWNER: ${{ steps.validate.outputs.owner }}
          REPO_NAME: ${{ steps.validate.outputs.repo_name }}
          REPO_VISIBILITY: ${{ inputs.repo_visibility }}
          VERSION: ${{ inputs.version }}
          VERSION_LABEL: ${{ inputs.version_label }}
          AUTHOR_NAME: ${{ inputs.author_name }}
          AUTHOR_ORCID: ${{ inputs.author_orcid }}
          TOPIC: ${{ inputs.topic }}
        run: |
          {
            echo "  ## Bootstrap result"
            echo ""
            if [ -n "$REPO_URL" ]; then
              echo "| Field | Value |"
              echo "|-------|-------|"
              echo "| Repo | [\`${OWNER}/${REPO_NAME}\`](${REPO_URL}) |"
              echo "| Visibility | \`${REPO_VISIBILITY}\` |"
              DEFAULT_BRANCH="$(cd "$PROJECT_DIR" && git rev-parse --abbrev-ref HEAD)"
              echo "| Default branch | \`${DEFAULT_BRANCH}\` |"
              echo "| Version | \`${VERSION}\` (${VERSION_LABEL}) |"
              echo "| Author | ${AUTHOR_NAME} (ORCID ${AUTHOR_ORCID}) |"
              echo "| Topic slug | \`${TOPIC}\` |"
              echo ""
              echo "  ##  # Next steps"
              echo ""
              echo "1. \`git clone\` the new repo locally."
              echo "2. (Optional) Edit \`metadata.yaml\` to refine title/keywords/etc."
              echo "3. Run \`make metadata\` to regenerate \`CITATION.cff\`, \`.zenodo.json\`, the README citation block, and the title block in \`paper/article.tex\`."
              echo "4. Open \`paper/sections/00_abstract.tex\` and start writing."
              echo "5. \`make pdf\` to build the PDF."
              echo "6. Zenodo archives the public companion, not this repo. If a companion was created, switch it on at https://zenodo.org/account/settings/github/ (sync, then toggle); see docs/skills/enabling-zenodo-for-a-companion.md."
              echo "7. When ready to release: bump \`version\` in \`metadata.yaml\`, add a \`CHANGES.md\` entry, run \`make metadata && make pdf\`, commit, \`git tag v1.0.0 && git push origin v1.0.0\` — the \`release.yml\` workflow in the new repo will build and publish the artifacts."
            else
              echo "Bootstrap failed. See the job log above for the error."
              echo ""
              echo "Common failure: the App is not installed on the owner, or \`owner\` is missing from the \`APP_OWNERS\` variable."
              echo "See docs/skills/setting-up-the-article-github-app.md."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  companion:
    name: Provision public companion repo
    needs: bootstrap
    if: inputs.create_companion
    permissions:
      contents: read
    uses: ./.github/workflows/provision-companion.yml
    with:
      repo: ${{ needs.bootstrap.outputs.repo_full }}
      dry_run: false
    secrets: inherit
