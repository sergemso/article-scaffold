# Create the public companion repo of an article repo.
#
# Idempotent: it creates the companion only if absent, re-applies description and
# topics, never changes visibility and never deletes. Decisions 0060 (provisioning)
# and 0062 (identity): the token is a GitHub App installation token minted with
# .github/actions/app-token from the secret APP_PRIVATE_KEY and the variables APP_ID
# and APP_OWNERS. It is not narrowed to a repository because the companion does not
# exist yet; fact 0005 notes any such token can create repos, so the script always
# creates them public explicitly and never touches an existing repo's visibility.

name: Provision companion repo

"on":
  workflow_dispatch:
    inputs:
      repo:
        description: "Article repo as OWNER/NAME, or `all` for every articles.* repo of the owner"
        required: true
        default: "all"
      owner:
        description: "Owner for `all`; must be listed in APP_OWNERS"
        required: false
        default: "strebulaev-articles"
      dry_run:
        description: "Read only; report what would change"
        type: boolean
        default: true
  workflow_call:
    inputs:
      repo:
        type: string
        required: false
        default: "all"
      owner:
        type: string
        required: false
        default: "strebulaev-articles"
      dry_run:
        type: boolean
        required: false
        default: true

permissions:
  contents: read

concurrency:
  group: provision-companion-${{ inputs.repo }}
  cancel-in-progress: false

jobs:
  provision:
    name: Provision companion
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout article-scaffold
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Resolve owner
        id: owner
        env:
          REPO: ${{ inputs.repo }}
          OWNER_INPUT: ${{ inputs.owner }}
        run: |
          set -euo pipefail
          if [ "$REPO" = "all" ]; then
            OWNER="$OWNER_INPUT"
          else
            OWNER="${REPO%%/*}"
          fi
          echo "owner=$OWNER" >> "$GITHUB_OUTPUT"

      - name: Mint installation token
        id: token
        uses: ./.github/actions/app-token
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ steps.owner.outputs.owner }}
          permission-administration: write
          permission-contents: read

      - name: Provision
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          REPO: ${{ inputs.repo }}
          OWNER: ${{ steps.owner.outputs.owner }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          set +x   # the token lives in the environment; never trace it
          ARGS=(--repo "$REPO" --owner "$OWNER" --json)
          if [ "$DRY_RUN" = "true" ]; then ARGS+=(--dry-run); fi
          status=0
          python3 scripts/provision_companion.py "${ARGS[@]}" > results.json || status=$?
          cat results.json
          {
            echo "## Companion provisioning (dry run: ${DRY_RUN})"
            echo ""
            echo "| Article repo | Status | Companion | Detail |"
            echo "|---|---|---|---|"
            python3 - <<'PY'
          import json
          for r in json.load(open("results.json"))["results"]:
              print(f"| `{r['repo']}` | {r['status']} | `{r['companion']}` | {r['detail']} |")
          PY
            echo ""
            echo "- New or changed companion: switch it on at https://zenodo.org/account/settings/github/ (sync, then toggle). This cannot be automated."
            echo "- \`needs-upgrade\`: run \`python3 -m scripts.article upgrade\` in that article repo, then provision again."
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
