# Template tests: lint, unit tests, and a real render.
#
# The special-character fixture is rendered here too, but only the default
# render is checked for metadata drift. The known escaping bugs are tracked as
# xfail tests in tests/test_render.py and are fixed in Phase 1.
name: Template tests

"on":
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: template-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Install dev tools
        run: make setup

      - name: Run linters
        run: make lint

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      # Tests that build real PDFs need latexmk and the packages the template loads.
      - name: Install TeX Live
        run: sh .github/scripts/install-tex.sh

      - name: Install dev tools
        run: make setup

      # Generated repos run `python3 -m scripts.article`, which needs the venv's PyYAML.
      - name: Run pytest
        run: PATH="$PWD/.venv/bin:$PATH" make test

  render:
    name: Render and validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Install dev tools
        run: make setup

      - name: Put the dev environment on PATH
        run: echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Render default and special-character fixtures
        run: |
          .venv/bin/python - <<'PY'
          from pathlib import Path

          from tests.conftest import SPECIAL_ABSTRACT, SPECIAL_TITLE, render

          default = render(tmp_path=Path("/tmp/render/default"))
          special = render(
              tmp_path=Path("/tmp/render/special"),
              title=SPECIAL_TITLE,
              abstract=SPECIAL_ABSTRACT,
          )
          Path("/tmp/render/paths").write_text(f"{default}\n{special}\n")
          print(f"default={default}")
          print(f"special={special}")
          PY

      - name: Validate both renders
        run: |
          DEFAULT=$(sed -n '1p' /tmp/render/paths)
          SPECIAL=$(sed -n '2p' /tmp/render/paths)
          test -f "$DEFAULT/paper/article.tex"
          test -f "$SPECIAL/paper/article.tex"
          make -C "$DEFAULT" validate
          make -C "$SPECIAL" validate

      - name: Check metadata drift on the default render
        run: |
          DEFAULT=$(sed -n '1p' /tmp/render/paths)
          SPECIAL=$(sed -n '2p' /tmp/render/paths)
          make -C "$DEFAULT" metadata-check
          make -C "$SPECIAL" metadata-check
          git -C "$DEFAULT" add -A
          git -C "$DEFAULT" \
            -c user.name=CI \
            -c user.email=ci@example.invalid \
            commit -qm initial
          make -C "$DEFAULT" metadata
          git -C "$DEFAULT" diff --exit-code

  network:
    name: Network checks (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Install dev tools
        run: make setup

      - name: Put the dev environment on PATH
        run: echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Resolve Zenodo ids and validate CFF
        env:
          RUN_NETWORK: "1"
        run: .venv/bin/python -m pytest tests/test_schemas.py -q -m network
