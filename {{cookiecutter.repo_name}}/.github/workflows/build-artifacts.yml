# Build Artifacts
#
# Builds PDF and DOCX artifacts on push to the default branch.
# Reuses the shared build workflow from the scaffold repository.

name: Build Artifacts

"on":
  push:
    branches:
      - __DEFAULT_BRANCH__
    paths:
      - 'paper/**'
      - '.github/workflows/build-artifacts.yml'
    tags-ignore:
      - 'v*'   # tags are handled by release.yml, which reuses this build
  pull_request:
    paths:
      - 'paper/**'
      - '.github/workflows/build-artifacts.yml'
  workflow_dispatch: {}

concurrency:
  group: build-artifacts-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build PDF and DOCX
    uses: ./.github/workflows/reusable-build.yml
    with:
      artifact-retention-days: "7"