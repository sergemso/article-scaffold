name: Validate LaTeX

"on":
  push:
    branches:
      - __DEFAULT_BRANCH__
    paths:
      - 'paper/**'
      - 'scripts/**'
      - 'Makefile'
      - '.github/workflows/validate-latex.yml'
  pull_request:
    paths:
      - 'paper/**'
      - 'scripts/**'
      - 'Makefile'
      - '.github/workflows/validate-latex.yml'
  workflow_dispatch: {}

concurrency:
  group: validate-latex-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Check LaTeX sources
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python3 -m pip install "pyyaml==6.0.2"

      - name: Validate paper sources
        run: python3 scripts/validate-paper.py