name: Validate LaTeX

on:
  push:
    branches:
      - '${{ github.event.repository.default_branch }}'
    paths:
      - 'paper/**'
      - 'scripts/**'
      - 'Makefile'
      - '.github/workflows/validate-latex.yml'
  pull_request:
    paths:
      - 'paper/**'
      - 'scripts/**'
      - 'Makefile'
      - '.github/workflows/validate-latex.yml'
  workflow_dispatch: {}

concurrency:
  group: validate-latex-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Check LaTeX sources
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate paper sources
        run: python3 scripts/validate-paper.py
