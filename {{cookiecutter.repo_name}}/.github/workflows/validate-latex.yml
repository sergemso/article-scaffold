name: Validate LaTeX

"on":
  push:
    branches:
      - '${{ github.event.repository.default_branch }}'
    paths:
      - 'paper/**'
      - 'scripts/**'
      - 'Makefile'
      - '.github/workflows/validate-latex.yml'
  pull_request:
    paths:
      - 'paper/**'
      - 'scripts/**'
      - 'Makefile'
      - '.github/workflows/validate-latex.yml'
  workflow_dispatch: {}

concurrency:
  group: validate-latex-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Check LaTeX sources
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.3.0
        with:
          python-version: '3.12'

      - name: Validate paper sources
        run: python3 scripts/validate-paper.py