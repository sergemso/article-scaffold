# Release
#
# Builds PDF and DOCX artifacts on tag push, then creates a GitHub Release.
# Reuses the shared build workflow from the scaffold repository.

name: Release

"on":
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # required by softprops/action-gh-release to create the release

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false   # never cancel a release mid-flight

jobs:
  build:
    name: Build PDF and DOCX
    uses: ./.github/workflows/reusable-build.yml
    with:
      artifact-retention-days: "1"

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Download DOCX artifact
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4.2.1
        with:
          name: manuscript-docx
          path: release-assets

      - name: Download PDF artifact
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4.2.1
        with:
          name: manuscript-pdf
          path: release-assets

      - name: Verify assets
        run: |
          ls -lh release-assets/
          for f in manuscript.docx manuscript.pdf; do
            if [ ! -f "release-assets/$f" ]; then
              echo "::error::Missing $f"
              exit 1
            fi
          done

      - name: Create Release with assets
        uses: softprops/action-gh-release@c95fe1489396fe8a4ebc57f6e0cba1051188c12b # v2.2.1
        with:
          # Tag name is the trigger tag (e.g., "v3"). Use tag_name explicitly
          # so the release is associated with the tag, not with the workflow run.
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true   # auto-generate from commits since last tag
          files: |
            release-assets/manuscript.docx
            release-assets/manuscript.pdf
          fail_on_unmatched_files: true