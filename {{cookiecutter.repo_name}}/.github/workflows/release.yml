# Release
#
# Builds PDF and DOCX artifacts on tag push, then creates a GitHub Release.
# Reuses the shared build workflow from the scaffold repository.

name: Release

"on":
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # required by softprops/action-gh-release to create the release

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false   # never cancel a release mid-flight

jobs:
  build:
    name: Build PDF and DOCX
    uses: ./.github/workflows/reusable-build.yml
    with:
      artifact-retention-days: "1"

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download manuscript artifact
        uses: actions/download-artifact@v8
        with:
          name: manuscript
          path: release-assets

      - name: Verify assets
        run: |
          ls -lh release-assets/
          for f in manuscript.docx manuscript.pdf; do
            if [ ! -f "release-assets/$f" ]; then
              echo "::error::Missing $f"
              exit 1
            fi
          done

      - name: Create Release with assets
        uses: softprops/action-gh-release@v3
        with:
          # Tag name is the trigger tag (e.g., "v3"). Use tag_name explicitly
          # so the release is associated with the tag, not with the workflow run.
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true   # auto-generate from commits since last tag
          files: |
            release-assets/manuscript.docx
            release-assets/manuscript.pdf
          fail_on_unmatched_files: true

  deploy-pages:
    name: Deploy to GitHub Pages
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download manuscript artifact
        uses: actions/download-artifact@v8
        with:
          name: manuscript
          path: bundle

      # supp/ is absent when the repository has no standalone supplementary document.
      - name: Assemble Pages content
        run: |
          mkdir -p pages
          cp bundle/manuscript.pdf pages/
          if [ -d bundle/supp ]; then cp -r bundle/supp pages/supp; fi

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: pages