# Release
#
# Builds PDF and DOCX artifacts on tag push, then creates a GitHub Release.
# Reuses the shared build workflow from the scaffold repository.

name: Release

"on":
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # required by softprops/action-gh-release to create the release

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false   # never cancel a release mid-flight

jobs:
  build:
    name: Build PDF and DOCX
    uses: ./.github/workflows/reusable-build.yml
    with:
      artifact-retention-days: "1"

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Download DOCX artifact
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e
        with:
          name: manuscript-docx
          path: release-assets

      - name: Download PDF artifact
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e
        with:
          name: manuscript-pdf
          path: release-assets

      - name: Verify assets
        run: |
          ls -lh release-assets/
          for f in manuscript.docx manuscript.pdf; do
            if [ ! -f "release-assets/$f" ]; then
              echo "::error::Missing $f"
              exit 1
            fi
          done

      - name: Create Release with assets
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda
        with:
          # Tag name is the trigger tag (e.g., "v3"). Use tag_name explicitly
          # so the release is associated with the tag, not with the workflow run.
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true   # auto-generate from commits since last tag
          files: |
            release-assets/manuscript.docx
            release-assets/manuscript.pdf
          fail_on_unmatched_files: true

  deploy-pages:
    name: Deploy to GitHub Pages
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Download PDF artifact
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e
        with:
          name: manuscript-pdf
          path: pages

      # Absent when the repository has no standalone supplementary document.
      - name: Download supplementary artifacts
        continue-on-error: true
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e
        with:
          name: manuscript-supp
          path: pages/supp

      - name: Setup Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: pages