# Reusable workflow to build PDF, DOCX and supplementary artifacts.
# Everything is uploaded as one artifact, "manuscript" (a single zip).
# Called by build-artifacts.yml and release.yml in generated repositories,
# and by template tests in the scaffold repository.
#
# Usage:
#   uses: ./.github/workflows/reusable-build.yml
#   with:
#     texlive-version: "2024"
#     pandoc-image: "pandoc/core:3.1"
#     artifact-retention-days: "7"
#     upload-pdf: "true"
#     upload-docx: "true"
#     upload-supp: "true"

name: Reusable Build

"on":
  workflow_call:
    inputs:
      texlive-version:
        description: "TeX Live version for xu-cheng/texlive-action"
        type: string
        required: false
        default: "2024"
      pandoc-image:
        description: "Pandoc Docker image tag"
        type: string
        required: false
        default: "pandoc/core:3.1"
      artifact-retention-days:
        description: "Artifact retention in days"
        type: string
        required: false
        default: "7"
      upload-pdf:
        description: "Whether to build and upload PDF"
        type: string
        required: false
        default: "true"
      upload-docx:
        description: "Whether to build and upload DOCX"
        type: string
        required: false
        default: "true"
      upload-supp:
        description: "Whether to build and upload supplementary PDFs"
        type: string
        required: false
        default: "true"

concurrency:
  group: reusable-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build manuscript artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # The files derived from metadata.yaml are rebuilt in the runner so the
      # artifact always matches it. Nothing is committed here; metadata-sync.yml
      # opens a pull request when the committed copies have drifted.
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Regenerate files derived from metadata.yaml
        run: |
          python3 -m pip install pyyaml
          python3 -m scripts.article metadata

      - name: Build DOCX with Pandoc
        if: ${{ inputs.upload-docx == 'true' }}
        run: |
          set -e
          # Pandoc resolves \input{sections/...} against its working directory, so it
          # runs in paper/ (mirrors `make docx`).
          REFERENCE_ARGS=""
          if [ -f reference.docx ]; then
            REFERENCE_ARGS="--reference-doc=/workspace/reference.docx"
          fi
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace/paper \
            ${{ inputs.pandoc-image }} \
            --output=/workspace/manuscript.docx \
            --from=latex \
            --to=docx \
            --citeproc \
            --bibliography=refs.bib \
            --resource-path=.:figures:.. \
            $REFERENCE_ARGS \
            article.tex

      - name: Verify DOCX output
        if: ${{ inputs.upload-docx == 'true' }}
        run: |
          if [ ! -f manuscript.docx ]; then
            echo "::error::Pandoc did not produce manuscript.docx"
            exit 1
          fi
          SIZE=$(stat -c%s manuscript.docx)
          echo "Built manuscript.docx ($SIZE bytes)"
          if [ "$SIZE" -lt 10240 ]; then
            echo "::error::DOCX is suspiciously small ($SIZE bytes)"
            exit 1
          fi

      - name: Compile LaTeX with TeX Live
        if: ${{ inputs.upload-pdf == 'true' }}
        uses: xu-cheng/texlive-action@v3
        with:
          texlive_version: ${{ inputs.texlive-version }}
          run: |
            cd paper
            latexmk -pdf -interaction=nonstopmode -file-line-error -halt-on-error article.tex
            test -f build/article.pdf
            cp build/article.pdf ../manuscript.pdf

      - name: Verify PDF output
        if: ${{ inputs.upload-pdf == 'true' }}
        run: |
          if [ ! -f manuscript.pdf ]; then
            echo "::error::pdflatex did not produce manuscript.pdf"
            exit 1
          fi
          SIZE=$(stat -c%s manuscript.pdf)
          echo "Built manuscript.pdf ($SIZE bytes)"
          if [ "$SIZE" -lt 20480 ]; then
            echo "::error::PDF is suspiciously small ($SIZE bytes)"
            exit 1
          fi
          if grep -q "There were undefined references" paper/article.log; then
            echo "::error::Some citations remain undefined - bibtex may have failed"
            echo "::group::Last 30 lines of article.log"
            tail -30 paper/article.log
            echo "::endgroup::"
            exit 1
          fi

      # Mirrors `make supp-pdf`: paper/supplementary.tex plus every
      # paper/supplementary/*.tex that has a \documentclass. Nothing to build
      # is not an error; the bundle then simply has no supp/ directory.
      - name: Compile supplementary documents with TeX Live
        if: ${{ inputs.upload-supp == 'true' }}
        uses: xu-cheng/texlive-action@v3
        with:
          texlive_version: ${{ inputs.texlive-version }}
          run: |
            mkdir -p supp
            build() {
              dir="$1"; file="$2"
              (cd "$dir" && latexmk -pdf -interaction=nonstopmode -file-line-error -halt-on-error -outdir=build "$file")
              cp "$dir/build/${file%.tex}.pdf" "supp/${file%.tex}.pdf"
            }
            if [ -f paper/supplementary.tex ] && grep -q '^[^%]*\\documentclass' paper/supplementary.tex; then
              build paper supplementary.tex
            fi
            for f in paper/supplementary/*.tex; do
              [ -f "$f" ] || continue
              if grep -q '^[^%]*\\documentclass' "$f"; then
                build paper/supplementary "$(basename "$f")"
              fi
            done

      # One zip with everything: manuscript.docx, manuscript.pdf, supp/*.pdf.
      - name: Upload manuscript artifact
        uses: actions/upload-artifact@v7
        with:
          name: manuscript
          path: |
            manuscript.docx
            manuscript.pdf
            supp/*.pdf
          retention-days: ${{ inputs.artifact-retention-days }}
          if-no-files-found: error
