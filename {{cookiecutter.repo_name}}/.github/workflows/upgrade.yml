name: Template upgrade

# Weekly check for a newer commit of the template this repository was generated
# from. When there is one, open a pull request with the changes. Conflicts are
# committed as markers and the PR is a draft; resolving them and running
# `python3 -m scripts.article upgrade --finish` is left to a person.
#
# Needs the template at a public HTTPS URL, a non-null `template_commit` in
# template.json, and Settings > Actions > General > "Allow GitHub Actions to
# create and approve pull requests". Otherwise the run only prints a notice.
# See docs/cli.md ("Upgrading to a newer template").
#
# GitHub rejects a push that adds or changes anything under .github/workflows/
# when it is made with the default token, and the template ships workflows. To
# open upgrade PRs that touch them, add a repository secret UPGRADE_TOKEN: a
# fine-grained token for this repository with Contents, Pull requests and
# Workflows set to write. A PR opened with the default token has its checks held
# for approval; with UPGRADE_TOKEN they start by themselves. The token expires:
# renew it, or the job falls back to the default token.

"on":
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch: {}

concurrency:
  group: template-upgrade
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  upgrade:
    name: Open an upgrade pull request
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.UPGRADE_TOKEN || github.token }}

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install cookiecutter
        run: python3 -m pip install "cookiecutter==2.7.1" pyyaml

      - name: Plan the upgrade
        id: plan
        run: |
          set -euo pipefail
          # Keep scratch files out of the checkout: the upgrade needs a clean tree.
          python3 -m scripts.article upgrade --plan --json > "$RUNNER_TEMP/plan.json" || true
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os

          d = json.load(open(os.path.join(os.environ["RUNNER_TEMP"], "plan.json")))
          plan = d.get("plan") or {}
          template = plan.get("template") or ""
          if d.get("refusals"):
              codes = ", ".join(r["code"] for r in d["refusals"])
              first = d["refusals"][0]["message"]
              print("action=skip")
              print(f"reason=the upgrade is refused ({codes}): {first}")
          elif not template.startswith("https://"):
              print("action=skip")
              print(f"reason=the template ({template or 'unknown'}) is not an HTTPS URL")
          elif plan.get("up_to_date"):
              print("action=skip")
              print("reason=already up to date")
          else:
              print("action=apply")
              print(f"new={plan['new']}")
              print(f"branch=upgrade/{plan['new'][:8]}")
          PY

      - name: Say why nothing was done
        if: steps.plan.outputs.action != 'apply'
        env:
          REASON: ${{ steps.plan.outputs.reason }}
        run: echo "::notice title=Template upgrade skipped::${REASON}"

      - name: Stop if the upgrade branch already exists
        id: existing
        if: steps.plan.outputs.action == 'apply'
        env:
          BRANCH: ${{ steps.plan.outputs.branch }}
        run: |
          if git ls-remote --exit-code --heads origin "$BRANCH" > /dev/null; then
            echo "::notice title=Template upgrade skipped::branch $BRANCH already exists"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Apply the upgrade on a branch
        id: apply
        if: steps.plan.outputs.action == 'apply' && steps.existing.outputs.exists == 'false'
        env:
          NEW: ${{ steps.plan.outputs.new }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 -m scripts.article upgrade --apply --commit --to "$NEW" --json > "$RUNNER_TEMP/apply.json" || true
          python3 - <<'PY'
          import json
          import os
          import sys

          temp = os.environ["RUNNER_TEMP"]
          d = json.load(open(os.path.join(temp, "apply.json")))
          if "error" in d:
              print(f"::error title=Template upgrade failed::{d['error']['code']}: {d['error']['message']}")
              sys.exit(1)
          if d.get("no_changes"):
              open(os.path.join(temp, "no-changes"), "w").write("yes")
              print("::notice title=Template upgrade skipped::the template has a newer commit, "
                    "but it changes none of the files generated for this repository")
              sys.exit(0)
          conflicted = d["conflicted"]
          lines = [
              "Automated upgrade of this repository to a newer commit of its template.",
              "",
              f"Applied cleanly: {', '.join(d['applied']) or 'nothing'}",
          ]
          if conflicted:
              lines += ["", "Conflicts to resolve (markers are committed):"]
              lines += [f"- `{path}`" for path in conflicted]
          if d["skipped"]:
              lines += ["", "Skipped:"]
              lines += [f"- `{s['path']}`: {s['reason']}" for s in d["skipped"]]
          lines += [
              "",
              "To finish: check out this branch, resolve any conflicts, then run",
              "`python3 -m scripts.article upgrade --finish`, commit and push.",
              "That regenerates derived files, runs `make validate` and updates template.json.",
              "If it stops with U019, a derived file (README.md, CITATION.cff, ...) has hand",
              "edits that metadata.yaml lacks: move them into metadata.yaml, or pass",
              "`--regenerate` to overwrite them.",
          ]
          open(os.path.join(temp, "pr-body.md"), "w").write("\n".join(lines) + "\n")
          open(os.path.join(temp, "draft"), "w").write("yes" if conflicted else "no")
          PY

      - name: Push the branch and open the pull request
        if: steps.plan.outputs.action == 'apply' && steps.existing.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.UPGRADE_TOKEN || github.token }}
          BRANCH: ${{ steps.plan.outputs.branch }}
          BASE: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [ -f "$RUNNER_TEMP/no-changes" ]; then
            exit 0
          fi
          flags=()
          if [ "$(cat "$RUNNER_TEMP/draft")" = "yes" ]; then
            flags+=(--draft)
          fi
          git push origin "HEAD:refs/heads/${BRANCH}"
          gh pr create --base "$BASE" --head "$BRANCH" \
            --title "Upgrade to template ${BRANCH#upgrade/}" \
            --body-file "$RUNNER_TEMP/pr-body.md" "${flags[@]}"
