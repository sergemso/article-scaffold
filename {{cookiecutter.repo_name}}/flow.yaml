# Flow state: decisions the repo cannot derive (round, attestations, waivers, budget).
# Schema: schemas/flow.schema.json. Gates are computed from the repo on every
# `flow status`; there is no stage pointer here. Attestations and waivers are
# recorded by a person in a terminal (`flow attest`, `flow waive`).
version: 1
round: 0
weights:
  script: 0
  small: 1
  large: 5
budget:
  limit: 20
  used: 0
retry_cap: 3
# The dialectic stage (contradictions and typed moves) runs first and must pass before a
# thesis is accepted (decision 0084). Remove the line below to make the stage advisory.
required_stages: [dialectic]
# Optional token-economy settings; the defaults apply while they are absent.
# max_calls: {small: 40, large: 60}   # advisory cap on tool calls per order
# brief_bytes: 6000                   # byte cap of `flow next --brief`
# group_size: 3                       # orders per group that write one file; 1 = off
# max_context: 120000                 # advisory context tokens; unset = call cap only
attestations: []
waivers: []
orders: {}
reviews: []
