# Theses map: claims, objections and defenses as a graph.
# Schema: schemas/theses.schema.json. Agents may add nodes with
# `status: proposed`; only a person sets `accepted` (with `accepted-by`).
# Node types: thesis, hypothesis, objection, defense, source-claim, argument.
# An argument ties numbered premises and an inference to one conclusion node.
# Objections and defenses take optional fields (target, form, tradition, kind, severity,
# answers, move, cost); see schemas/theses.schema.json. A theses `needs-rival-objection: true`
# makes `theses gaps` ask for a rival-tradition objection once it is accepted.
# An optional top-level `terms` list registers defined terms (kind defined, external or
# acronym); `theses lint` checks use before definition and second definitions, and
# `theses terms` lists orphans and drift.
# Optional `contradictions` (two anchored poles; kind dialectical, technical or physical; a
# technical one adds improving and worsening, and an optional `principle` tag from
# schemas/triz-principles.json) and `moves` (negation, negation-of-negation, synthesis,
# aufhebung with preserved/cancelled/lifted, new-beginning with `opens`) record the niche's
# tensions before the thesis is fixed (decision 0083). Leave them out and nothing changes.
# Edge types: supports, attacks, rebuts (edge goes from -> to).
version: 1
nodes: []
edges: []
