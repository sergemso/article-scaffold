# ─────────────────────────────────────────────────────────────
# Single source of truth for manuscript metadata.
#
# Edit this file, then run:
#   make metadata
# to regenerate CITATION.cff, .zenodo.json, the README.md citation
# block, and the title/author/date block in paper/article.tex.
#
# `make pdf`, `make docx` and the CI build regenerate these files first, so
# they never lag behind this file. Optional keys are documented in
# docs/metadata.md and schemas/metadata.schema.json.
#
# Regeneration is idempotent: it only overwrites the metadata-derived
# fields, leaving your prose untouched.
# ─────────────────────────────────────────────────────────────

metadata_schema: 2

title: {{ cookiecutter.title | tojson }}
{% if cookiecutter.subtitle %}
subtitle: {{ cookiecutter.subtitle | tojson }}
{% endif %}
manuscript_type: {{ cookiecutter.manuscript_type | tojson }}
manuscript_kind: {{ cookiecutter.manuscript_kind | tojson }}
citation_style: {{ cookiecutter.citation_style | tojson }}

# The abstract is the single source for the LaTeX abstract block, the README
# masthead, and the Zenodo description.
abstract: {{ cookiecutter.abstract | tojson }}

{% if cookiecutter.author_affiliation %}
affiliations:
  aff1:
    name: {{ cookiecutter.author_affiliation | tojson }}
    ror: ""   # optional; canonical form: https://ror.org/02mhbdp94
{% endif %}

authors:
  - name: {{ cookiecutter.author_name | tojson }}
    orcid: {{ cookiecutter.author_orcid | tojson }}
{% if cookiecutter.author_affiliation %}
    affiliations: [aff1]
{% endif %}
    corresponding: true
    email: ""   # optional; used for the corresponding-author footnote

version: {{ cookiecutter.version | tojson }}
version_label: {{ cookiecutter.version_label | tojson }}
date: {{ cookiecutter.date | tojson }}

license: {{ cookiecutter.license | tojson }}
# The scaffold code is always MIT; the paper may be CC-BY-4.0 or MIT.
license_code: "MIT"
target_deposit: {{ cookiecutter.target_deposit | tojson }}
doi: {{ cookiecutter.doi | tojson }}   # fill after deposit; leave empty for pre-deposit

# Repository coordinates — used in CITATION.cff, .zenodo.json, README badge
github_user: {{ cookiecutter.github_user | tojson }}
repo_name: {{ cookiecutter.repo_name | tojson }}
repo_url: {{ ("https://github.com/" ~ cookiecutter.github_user ~ "/" ~ cookiecutter.repo_name) | tojson }}

# Comma-separated; the generator also accepts a YAML list.
keywords: {{ cookiecutter.keywords | tojson }}

references: []

communities: []
